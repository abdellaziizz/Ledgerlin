name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (Vitest + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Unit, integration, concurrency, idempotency, invariant and migration tests
      # against a real PostgreSQL 18 started by Testcontainers.
      - run: npm test

  migrations:
    name: Migrations from an empty database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ledgerline
          POSTGRES_USER: ledgerline
          POSTGRES_PASSWORD: ledgerline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledgerline" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://ledgerline:ledgerline@localhost:5432/ledgerline
      JWT_SECRET: ci-only-secret
      ENV_FILE: /dev/null
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Migrate (twice, to prove it's idempotent)
        run: node scripts/migrate.js && node scripts/migrate.js
      - name: Seed (twice, the second run must replay every transfer)
        run: node scripts/seed.js && node scripts/seed.js | tee seed.log && grep -q " 0 new transfers" seed.log
      - name: Reconcile (fails the job on any drift)
        run: node scripts/reconcile.js

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
