server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # API, docs and health go to the Express container.
  location ~ ^/(api|docs|openapi\.json|health) {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  # Hashed assets can be cached forever; index.html never.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths render index.html and React Router takes over.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;
    try_files $uri /index.html;
  }
}
